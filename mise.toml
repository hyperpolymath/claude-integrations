#
# Toolchain for claude-integrations — monorepo with Elixir, Deno/JS, AffineScript
# Estate policy: Bun is primary JS runtime (Deno retired per 2026-08-26 but still used here for transition),
# no Python/Go/Java/Nix. See hyperpolymath/standards 3-practice/provisioning.

[settings]
lockfile = true

[tools]
# Core
just = "latest"
git = "latest"
shellcheck = "latest"

# Runtimes — allowed per estate language policy
# Elixir (firefox-lsp)
elixir = "latest"
erlang = "latest"

# Rust (potential model-router, etc)
rust = "latest"
cargo = "latest"

# Zig (FFI)
zig = "latest"

# JS runtimes — Bun primary
bun = "latest"

# Package managers — Bun primary
# npm/yarn/pnpm only where Bun cannot (browser extensions)
# pnpm kept for compatibility, npm as last resort

# Formatting & Linting (allowed)
shfmt = "latest"
stylua = "latest"

# Build tools (allowed)
cmake = "latest"
ninja = "latest"

[env]

[tasks.build]
run = "cargo build --release || bun run build"

[tasks.test]
run = "cargo test || bun test"

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check . || just lint-all"

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write . || just fmt"

