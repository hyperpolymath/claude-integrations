#
# Toolchain for claude-integrations — monorepo with Elixir, Deno/JS, AffineScript
# Estate policy: Bun is primary JS runtime (Deno retired per 2026-08-26 but still used here for transition),
# no Python/Go/Java/Nix. See hyperpolymath/standards 3-practice/provisioning.

[settings]
lockfile = true

[tools]
# Core
just = "latest"
git = "latest"
shellcheck = "latest"

# Runtimes — allowed per estate language policy
# Elixir (firefox-lsp)
elixir = "latest"
erlang = "latest"

# Rust (potential model-router, etc)
rust = "latest"
cargo = "latest"

# Zig (FFI)
zig = "latest"

# JS runtimes — Bun primary, Deno for legacy (retired but still in use), Node for extensions
bun = "latest"
deno = "latest"
node = "latest"

# Package managers — Bun primary
# npm/yarn/pnpm only where Bun cannot (browser extensions)
# pnpm kept for compatibility, npm as last resort

# Formatting & Linting (allowed)
prettier = "latest"
shfmt = "latest"
stylua = "latest"

# Build tools (allowed)
cmake = "latest"
ninja = "latest"

[env]
NODE_ENV = "development"

[alias]
build = "cargo build --release || bun run build || npm run build"
test = "cargo test || bun test || npm test"
lint = "prettier --check . || just lint-all"
fmt = "prettier --write . || just fmt"
