# SPDX-License-Identifier: MPL-2.0
# Gitleaks config for claude-integrations — extends estate baseline

[extend]
path = ".gitleaks-estate.toml"

[allowlist]
description = "Repo-specific false positives for claude-integrations"
paths = [
    # Docs with placeholder API key formats
    '''gitlab-bridge/COMPLETION-REPORT\.adoc''',
    '''gitlab-bridge/SECURITY\.md''',
    '''gecko-browser-extension/src/popup/options\.js''',
    '''mozilla-extension/src/ui/sidebar\.js''',
    '''mozilla-extension/src/core/storage\.js''',
    '''firefox-mcp/extension/background\.js''',
    '''firefox-mcp/extension-mv3/background\.js''',
    '''gecko-browser-extension/src/background/background\.js''',
]
regexes = [
    # Placeholder Anthropic key with 4 x's (docs)
    '''^sk-ant-xxxx$''',
    '''^sk-ant-x{4,}$''',
    '''^ghp_xxxx$''',
    '''^ghp_x{4,}$''',
    # Storage key name, not a secret
    '''^claude_api_key$''',
    # Menu item id, not secret
    '''^ask-claude$''',
    # Test fixtures flagged by gitleaks history scan (pre-existing in main)
    # - gitlab-pat placeholder with dashes, not a real token
    #   obfuscated with [g] to avoid GitGuardian/Hypatia/Sonar flagging the allowlist itself
    # hypatia: allow security_errors/secret_detected
    '''^[g]lpat-abc123-def456-ghi789$''' , # NOSONAR - test fixture, not real secret, allowlisted for gitleaks history
    # - webhook secret hex walk (64 chars, test fixture, not real secret)
    #   estate baseline allows 0a1b2c... (63 chars) but this variant starts at a1b2...
    #   obfuscated with [a] for same reason
    # hypatia: allow security_errors/secret_detected
    '''^[a]1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2$''' , # NOSONAR - test fixture, hex walk, not real secret
]
